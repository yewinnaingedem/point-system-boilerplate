# POS System — local MySQL + Redis. PHP and Node run on your machine.
#
#   docker compose up -d        start MySQL (3308) and Redis (6380)
#   composer dev                 app on http://localhost:8000 (+ queue, logs, vite)
#
# Ports are chosen so this runs next to the cargo project's containers (MySQL 3307, Redis 6379).

services:
  mysql:
    image: mysql:8.4
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pos_system}
      MYSQL_USER: ${DB_USERNAME:-pos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Yangon
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
